[project]
name = "webots-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Syed Talha Ali Shah", email = "syedtalhaa1076@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langgraph>=0.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
webots-ai-agent = "webots_ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
